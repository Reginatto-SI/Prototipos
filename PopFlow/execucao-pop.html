<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>PopFlow</title><script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--pf-bg:#F7F4EE;--pf-surface:#FFF;--pf-surface-muted:#F3F0EA;--pf-border:#E5DED2;--pf-text:#1F2933;--pf-muted:#667085;--pf-primary:#2563EB;--pf-primary-hover:#1D4ED8;--pf-primary-soft:#EFF6FF;--pf-primary-border:#BFDBFE;--pf-success:#2E7D5B;--pf-success-soft:#EAF6EF;--pf-success-border:#BFDCCB;--pf-success-text:#256F4D;--pf-warning:#B7791F;--pf-warning-soft:#FFF7E6;--pf-warning-border:#F1D59A;--pf-danger:#B42318;--pf-danger-soft:#FEF3F2;--pf-danger-border:#FDA29B}
/* Temas em validação aceleram decisão visual; os mesmos tokens serão design tokens no React/Lovable. */
body{background:var(--pf-bg);color:var(--pf-text)} .surface{background:var(--pf-surface);border-color:var(--pf-border)} .muted{color:var(--pf-muted)} .line{border-color:var(--pf-border)}
.btn-primary{background:var(--pf-primary);color:#fff}.btn-primary:hover{background:var(--pf-primary-hover)} .btn-sec{border:1px solid var(--pf-border);background:var(--pf-surface)}
.chip{border:1px solid var(--pf-border);background:var(--pf-surface);color:var(--pf-muted)} .chip-current{background:var(--pf-primary-soft);color:var(--pf-primary-hover);border-color:var(--pf-primary-border)}
.chip-done{background:var(--pf-success-soft);color:var(--pf-success-text);border-color:var(--pf-success-border)} .chip-imp{background:var(--pf-warning-soft);color:var(--pf-warning);border-color:var(--pf-warning-border)}
.badge-meta{background:var(--pf-surface-muted);color:var(--pf-muted);border:1px solid var(--pf-border)} .badge-run{background:var(--pf-warning-soft);color:var(--pf-warning);border:1px solid var(--pf-warning-border)}
.badge-done{background:var(--pf-success-soft);color:var(--pf-success-text);border:1px solid var(--pf-success-border)}
.progress-track{background:var(--pf-surface-muted)} .progress-fill{background:var(--pf-primary)} .danger{color:var(--pf-danger)}
.theme-btn.active{background:var(--pf-primary-soft);border-color:var(--pf-primary-border);color:var(--pf-primary-hover)}
</style></head>
<body class="min-h-screen">
<header class="fixed top-0 inset-x-0 z-30 surface border-b"><div class="max-w-5xl mx-auto px-6 py-4 flex items-start justify-between gap-4"><div><p class="text-xs font-semibold tracking-wide" style="color:var(--pf-primary-hover)">PopFlow • Documento Operacional Vivo</p><h1 id="popTitulo" class="text-2xl font-bold"></h1><p id="popDescricao" class="text-sm muted mt-1"></p><div class="flex flex-wrap gap-2 mt-2 text-xs"><span id="popVersao" class="px-2 py-1 rounded-full badge-meta"></span><span id="execStatus" class="px-2 py-1 rounded-full badge-run">Em andamento</span><span class="px-2 py-1 rounded-full badge-meta">Visibilidade: Operação Fiscal</span><span class="px-2 py-1 rounded-full badge-meta">Responsável: Ana Ribeiro</span><span class="px-2 py-1 rounded-full badge-meta">Tempo estimado: 35 min</span></div></div><div class="flex flex-col items-end gap-2"><div id="themePicker" class="flex gap-1"></div><button class="px-3 py-2 text-sm rounded-lg btn-sec">Sair</button></div></div></header>
<main class="max-w-5xl mx-auto px-6 pt-44 pb-16"><div id="layoutExecucao" class="grid grid-cols-1 gap-6"><section class="surface rounded-2xl p-4 border shadow-sm"><p id="progressText" class="text-sm muted"></p><div class="mt-2 h-2 progress-track rounded-full overflow-hidden"><div id="progressBar" class="h-full progress-fill"></div></div><p id="kpiLinha" class="mt-2 text-xs muted"></p></section><section class="surface rounded-2xl p-4 border shadow-sm"><div class="flex flex-col md:flex-row gap-2 md:items-center md:justify-between mb-3"><div class="flex gap-2"><button id="btnExpandirTudo" class="px-2.5 py-1.5 text-xs rounded-lg btn-sec">Expandir tudo</button><button id="btnRecolherConcluidas" class="px-2.5 py-1.5 text-xs rounded-lg btn-sec">Recolher concluídas</button></div><input id="buscaEtapa" type="text" placeholder="Buscar" class="w-full md:w-72 px-3 py-1.5 text-sm rounded-lg line border bg-transparent"/></div><p class="text-xs muted mb-2">Neste POP</p><nav id="indiceEtapas" class="flex flex-wrap gap-2"></nav></section><section id="listaEtapas" class="space-y-4"></section><section id="estadoFinal" class="hidden rounded-2xl p-5 badge-done"><h4 class="font-semibold">✅ Processo concluído</h4></section><aside id="painelMidiaWrapper" class="hidden lg:sticky lg:top-24"><section class="surface rounded-2xl p-4 border shadow-sm"><div class="flex justify-between items-center"><p class="text-sm font-semibold">Mini player de áudio</p><button id="fecharPainelMidia" class="text-xs muted">Fechar</button></div><p id="mediaTitulo" class="text-xs muted mt-2"></p><div id="mediaConteudo" class="mt-2"></div></section></aside></div></main>

function applyTheme(k){Object.entries(THEMES[k]).forEach(([t,v])=>document.documentElement.style.setProperty(t,v));localStorage.setItem(THEME_KEY,k);document.querySelectorAll('.theme-btn').forEach(b=>b.classList.toggle('active',b.dataset.theme===k));}
function renderThemePicker(){els.themePicker.innerHTML=['t1','t2','t3','t4','t5'].map((t,i)=>`<button class='theme-btn px-2 py-1 text-xs rounded border line muted' data-theme='${t}'>Tema ${i+1}</button>`).join('');}
const persistir=()=>localStorage.setItem(STORAGE_KEY,JSON.stringify(execucaoMock.etapas));
function carregar(){const raw=localStorage.getItem(STORAGE_KEY);if(raw)try{const saved=JSON.parse(raw);saved.forEach(s=>{const e=execucaoMock.etapas.find(x=>x.id===s.id);if(e)Object.assign(e,s);});}catch{}}
const icon=(m)=>m.tipo==='imagem'?'Imagem':m.tipo==='audio'?'Áudio':m.tipo==='video'?'Vídeo':m.formato==='pdf'?'PDF':'Doc';
const showToast=(m)=>{els.toast.textContent=m;els.toast.classList.remove('hidden');setTimeout(()=>els.toast.classList.add('hidden'),1700)};
const primeiraPendente=()=>execucaoMock.etapas.find(e=>!e.concluida);
const renderDesc=(e)=>e.descricao.replace(/@([a-zA-Z0-9_]+)/g,(_,r)=>{const m=e.midias.find(x=>x.ref===r);if(!m)return`@${r}`;return`<button class='chip px-2 py-1 rounded-md text-xs' data-etapa-id='${e.id}' data-media-ref='${m.ref}'>${icon(m)} • @${m.ref}</button>`});
function abrirMidia(m){if(m.tipo==='audio'){els.painelMidiaWrapper.classList.remove('hidden');els.layoutExecucao.classList.add('lg:grid-cols-[minmax(0,1fr)_260px]');els.mediaTitulo.textContent=m.titulo;els.mediaConteudo.innerHTML=`<audio controls class='w-full'><source src='${m.url}' type='audio/mpeg'></audio>`;currentAudio=els.mediaConteudo.querySelector('audio');return;}els.mediaModalTitulo.textContent=m.titulo;els.mediaModalTipo.textContent=icon(m);els.mediaModalConteudo.innerHTML=m.tipo==='imagem'?`<img src='${m.url}' class='w-full rounded-lg'/>`:m.tipo==='video'?`<video controls class='w-full rounded-lg'><source src='${m.url}' type='video/mp4'></video>`:`<iframe src='${m.url||''}' class='w-full h-[55vh] rounded-lg'></iframe>`;els.mediaModal.classList.remove('hidden');}
function closeAudio(){if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;}els.painelMidiaWrapper.classList.add('hidden');els.layoutExecucao.classList.remove('lg:grid-cols-[minmax(0,1fr)_260px]');els.mediaConteudo.innerHTML='';}
const closeModalFn=()=>{els.mediaModal.classList.add('hidden');els.mediaModalConteudo.innerHTML='';};
function renderIndice(etapas,atual){els.indiceEtapas.innerHTML=etapas.map((e,i)=>`<button class='px-2.5 py-1 rounded-full text-xs border ${e.id===atual?.id?'chip-current':e.concluida?'chip-done':e.importante?'chip-imp':'chip'}' data-scroll-step='${e.id}'>${i+1}</button>`).join('');}
function renderProgresso(){const t=execucaoMock.etapas.length,c=execucaoMock.etapas.filter(e=>e.concluida).length,p=Math.round((c/t)*100),imp=execucaoMock.etapas.filter(e=>e.importante).length;els.progressText.textContent=`${c} de ${t} etapas concluídas`;els.progressBar.style.width=`${p}%`;els.kpiLinha.textContent=`${t-c} pendentes • ${imp} importantes`;els.execStatus.className=`px-2 py-1 rounded-full text-xs border ${c===t?'badge-done':'badge-run'}`;els.execStatus.textContent=c===t?'Concluída':'Em andamento';els.estadoFinal.classList.toggle('hidden',c!==t);}
function renderEtapas(){const atual=primeiraPendente();const filtered=execucaoMock.etapas.filter(e=>(`${e.titulo} ${e.descricao}`).toLowerCase().includes(buscaTexto.toLowerCase()));els.listaEtapas.innerHTML=filtered.map((e,i)=>{const open=!e.colapsada||e.id===atual?.id||e.importante;const ori=(e.resultadoEsperado||e.erroComum)?`<div class='text-sm muted border-l-2 line pl-3 mb-3'>${e.resultadoEsperado?`<p><strong>Resultado esperado:</strong> ${e.resultadoEsperado}</p>`:''}${e.erroComum?`<p class='danger mt-1'><strong>Erro comum:</strong> ${e.erroComum}</p>`:''}</div>`:'';return`<article id='${e.id}' class='surface border rounded-2xl p-5 shadow-sm ${e.id===atual?.id?'border-l-4':''}' style='border-left-color:${e.id===atual?.id?'var(--pf-primary)':'transparent'}'><div class='flex justify-between'><div><p class='text-xs muted'>Etapa ${i+1}</p><h3 class='text-base font-semibold'>${e.concluida?'✅ ':''}${e.titulo}</h3></div><div class='flex gap-2'><button data-fav-etapa='${e.id}' class='text-sm ${e.importante?'chip-imp':'muted'}'>${e.importante?'★':'☆'}</button><button data-toggle-colapso='${e.id}' class='text-xs muted'>${open?'Recolher':'Expandir'}</button></div></div>${open?`<div class='text-sm muted mt-3 mb-3 leading-6'>${renderDesc(e)}</div>${ori}${e.checklist.length?`<ul class='space-y-1.5 mb-3'>${e.checklist.map(c=>`<li class='flex items-center gap-2 text-sm'><input type='checkbox' ${c.concluido?'checked':''} data-etapa-id='${e.id}' data-check-id='${c.id}'/><span>${c.texto}</span></li>`).join('')}</ul>`:''}<button data-concluir-etapa='${e.id}' class='btn-primary px-3 py-1.5 rounded-lg text-sm'>${e.concluida?'Concluída':'Marcar como concluída'}</button>`:`<p class='mt-2 text-xs muted'>${e.concluida?'Concluída':'Pendente'}</p>`}</article>`}).join('');renderIndice(filtered,atual);}
function render(){els.popTitulo.textContent=execucaoMock.pop.titulo;els.popDescricao.textContent=execucaoMock.pop.descricao;els.popVersao.textContent=execucaoMock.pop.versao;renderProgresso();renderEtapas();persistir();}
addEventListener('click',(ev)=>{const t=ev.target.closest('[data-theme]');if(t)applyTheme(t.dataset.theme);const s=ev.target.closest('[data-scroll-step]');if(s)document.getElementById(s.dataset.scrollStep)?.scrollIntoView({behavior:'smooth'});const m=ev.target.closest('[data-media-ref]');if(m){const e=execucaoMock.etapas.find(x=>x.id===m.dataset.etapaId);const media=e?.midias.find(x=>x.ref===m.dataset.mediaRef);if(media)abrirMidia(media);}const ck=ev.target.closest('[data-check-id]');if(ck){const e=execucaoMock.etapas.find(x=>x.id===ck.dataset.etapaId);const c=e?.checklist.find(x=>x.id===ck.dataset.checkId);if(c)c.concluido=ck.checked;persistir();}const cc=ev.target.closest('[data-concluir-etapa]');if(cc){const e=execucaoMock.etapas.find(x=>x.id===cc.dataset.concluirEtapa);if(e){e.concluida=!e.concluida;render();}}const f=ev.target.closest('[data-fav-etapa]');if(f){const e=execucaoMock.etapas.find(x=>x.id===f.dataset.favEtapa);if(e){e.importante=!e.importante;e.colapsada=false;render();showToast(e.importante?'Etapa marcada como importante':'Etapa removida dos importantes');}}const c=ev.target.closest('[data-toggle-colapso]');if(c){const e=execucaoMock.etapas.find(x=>x.id===c.dataset.toggleColapso);if(e){e.colapsada=!e.colapsada;render();}}});
els.btnExpandirTudo.onclick=()=>{execucaoMock.etapas.forEach(e=>e.colapsada=false);render()};els.btnRecolherConcluidas.onclick=()=>{const a=primeiraPendente();execucaoMock.etapas.forEach(e=>{if(e.concluida&&!e.importante&&e.id!==a?.id)e.colapsada=true});render()};
els.buscaEtapa.oninput=e=>{buscaTexto=e.target.value;renderEtapas()};els.fecharPainelMidia.onclick=closeAudio;els.closeModal.onclick=closeModalFn;els.mediaModal.onclick=e=>{if(e.target===els.mediaModal)closeModalFn()};
renderThemePicker();applyTheme(localStorage.getItem(THEME_KEY)||'t1');carregar();render();
</script></body></html>
